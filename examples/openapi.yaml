openapi: 3.1.0
info:
  title: Widget API
  version: 1.0.0
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: in-stock
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Matching widgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Widget'
    post:
      operationId: createWidget
      summary: Create a widget
      security:
        - bearer: []
        - tenantKey: []
          queryKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWidget'
      responses:
        '201':
          description: Created widget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '202':
          description: Queued for creation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedWidget'
  /widgets/events:
    get:
      operationId: streamWidgets
      summary: Watch widget activity
      x-profile-category: live
      responses:
        '200':
          description: Widget activity
          content:
            text/event-stream: {}
  /widgets/{widget-id}:
    parameters:
      - name: widget-id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWidget
      summary: Get a widget by ID
      responses:
        '200':
          description: Matching widget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '204':
          description: Widget is not visible
    delete:
      operationId: deleteWidget
      summary: Delete a widget by ID
      responses:
        '204':
          description: Widget deleted
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    tenantKey:
      type: apiKey
      in: header
      name: X-Tenant-Key
    queryKey:
      type: apiKey
      in: query
      name: access_key
  schemas:
    CreateWidget:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
    QueuedWidget:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          const: queued
    WidgetLabel:
      type: string
    Widget:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/WidgetLabel'
        description:
          type: [string, 'null']
