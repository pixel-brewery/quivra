# Green Dependabot pull requests merge automatically: .github/workflows/dependabot-merge.yml
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      cargo-compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions-updates:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      node-tooling-updates:
        patterns: ["*"]
