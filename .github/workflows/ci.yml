name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check Architect inheritance
        if: runner.os == 'Linux'
        run: python3 .agents/scripts/sync_architect_core.py --check

      - name: Check Rust formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test the CLI
        run: cargo test --locked

      - name: Verify generated clients
        run: |
          cargo build --locked
          quivra=target/debug/quivra
          if [[ "$RUNNER_OS" == "Windows" ]]; then quivra="$quivra.exe"; fi
          "$quivra" generate examples/openapi.yaml --profile examples/profiles/fetch --out examples/generated/fetch --check
          "$quivra" generate examples/openapi.yaml --profile examples/profiles/transport --out examples/generated/transport --check
          npm exec --yes --package typescript@7.0.2 -- tsc \
            --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --noEmit \
            --target ES2022 --module ESNext --lib ES2022,DOM \
            examples/generated/fetch/client.ts examples/generated/transport/client.ts examples/generated/transport/routes.ts
          node examples/smoke.mjs

  quality-gate:
    name: Quality Gate
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every platform verification to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
