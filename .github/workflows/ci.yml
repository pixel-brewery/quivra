name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact source requested by trusted dependency automation
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      candidate_artifact_id:
        type: string
      release_commit:
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Require the requested dependency source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: test -z "$EXPECTED_HEAD_SHA" || test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"

      - name: Download the release candidate
        if: inputs.candidate_artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/quivra-candidate

      - name: Check out the release candidate
        if: inputs.candidate_artifact_id != '' || inputs.release_commit != ''
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/quivra-candidate
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: node distribution/release-candidate.ts import "$CANDIDATE_DIR" "$GITHUB_SHA" "$RELEASE_COMMIT"

      - name: Check Architect inheritance
        if: runner.os == 'Linux'
        run: python3 .agents/scripts/sync_architect_core.py --check

      - name: Install TypeScript tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check TypeScript tooling
        run: |
          npm run check:types
          npm run test:automation

      - name: Check Rust formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test the CLI
        run: cargo test --locked

      - name: Verify generated clients
        run: |
          cargo build --locked
          quivra=target/debug/quivra
          if [[ "$RUNNER_OS" == "Windows" ]]; then quivra="$quivra.exe"; fi
          "$quivra" generate examples/openapi.yaml --profile examples/profiles/fetch --out examples/generated/fetch --check
          "$quivra" generate examples/openapi.yaml --profile examples/profiles/transport --out examples/generated/transport --check
          npm run check:examples
          node examples/smoke.ts

  quality-gate:
    name: Quality Gate
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every platform verification to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
