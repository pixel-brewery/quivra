name: Package distributions

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_artifact_id:
        type: string
      release_commit:
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: matrix
        run: echo "platforms=$(node distribution/prepare.ts matrix)" >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      RUST_TARGET: ${{ matrix.target }}
      OS_NAME: ${{ matrix.os }}
      NATIVE_TARBALL: ${{ matrix.npm_tarball_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.cpu }}
          package-manager-cache: false
      - name: Download the release candidate
        if: inputs.candidate_artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/quivra-candidate
      - name: Check out the release candidate
        if: inputs.candidate_artifact_id != '' || inputs.release_commit != ''
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/quivra-candidate
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: node distribution/release-candidate.ts import "$CANDIDATE_DIR" "$GITHUB_SHA" "$RELEASE_COMMIT"
      - name: Install the pinned compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the native executable
        run: |
          rustup target add "$RUST_TARGET"
          cargo build --locked --release --target "$RUST_TARGET"
      - name: Prepare npm tarballs and a GitHub release archive
        run: |
          binary=quivra
          if [[ "$OS_NAME" == "win32" ]]; then binary=quivra.exe; fi
          staging=target/distribution
          mkdir -p "$staging/artifacts"
          node distribution/prepare.ts native "$RUST_TARGET" "target/$RUST_TARGET/release/$binary" "$staging/native"
          node distribution/prepare.ts launcher "$staging/launcher"
          version=$(node -p 'require("./target/distribution/launcher/package.json").version')
          npm pack "./$staging/native" --ignore-scripts --pack-destination "$staging/artifacts"
          npm pack "./$staging/launcher" --ignore-scripts --pack-destination "$staging/artifacts"
          asset="quivra-$version-$RUST_TARGET.tar.gz"
          tar -C "$staging/native" -czf "$staging/artifacts/$asset" "$binary" LICENSE
          node distribution/checksum.ts "$staging/artifacts/$asset"
          printf 'PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Test the installed npm CLI and Node API
        run: |
          staging=target/distribution
          mkdir -p "$staging/smoke"
          cd "$staging/smoke"
          printf '{"private":true}\n' > package.json
          npm install --offline --ignore-scripts --no-audit --no-fund \
            "../artifacts/$NATIVE_TARBALL-$PACKAGE_VERSION.tgz" \
            "../artifacts/pixel-brewery-quivra-$PACKAGE_VERSION.tgz"
          test "$(npm exec --offline -- quivra --version)" = "quivra $PACKAGE_VERSION"
          cp ../../../distribution/smoke.ts .
          node smoke.ts ../../..
      - name: Type-check the installed Node API
        if: matrix.os == 'linux' && matrix.cpu == 'x64'
        working-directory: target/distribution/smoke
        run: |
          cp ../../../distribution/npm-api.types.ts .
          node ../../../node_modules/typescript/bin/tsc --ignoreConfig --strict --noEmit --target ES2022 --module NodeNext npm-api.types.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quivra-${{ matrix.target }}
          path: |
            target/distribution/artifacts/${{ env.NATIVE_TARBALL }}-*.tgz
            target/distribution/artifacts/*.tar.gz
            target/distribution/artifacts/*.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'linux' && matrix.cpu == 'x64'
        with:
          name: quivra-npm
          path: target/distribution/artifacts/pixel-brewery-quivra-${{ env.PACKAGE_VERSION }}.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 14
