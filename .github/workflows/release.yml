name: Release Quivra

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in Cargo.toml (for example 0.1.0)
        required: true
        type: string
      publish:
        description: Publish the verified artifacts to npm and GitHub Releases
        default: false
        type: boolean

permissions: {}

concurrency:
  group: quivra-release
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'pixel-brewery/quivra' && github.repository_id == '1457527723' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify requested version and source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          test "$VERSION" = "$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          if [ "$PUBLISH" = true ]; then
            if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" != public ]; then
              echo "Publishing requires the public canonical Quivra repository." >&2
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
              --jq 'any(.[]; .type == "required_status_checks" and
                .parameters.strict_required_status_checks_policy and
                any(.parameters.required_status_checks[]; .context == "Quality Gate"))' | grep -qx true
            gh api "repos/$GITHUB_REPOSITORY/environments/release-main/deployment-branch-policies" \
              --jq '([.branch_policies[] | select(.name == "main" and .type == "branch")] | length) == 1 and .total_count == 1' | grep -qx true
          fi

  verify:
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml

  validate:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-ids: ${{ steps.artifacts.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select this run's unexpired artifact IDs
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(node distribution/prepare.ts matrix | jq -c '[.include[].target | "quivra-" + .] + ["quivra-npm"] | sort')"
          artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            | jq -cs '[.[].artifacts[] | select(.expired == false and (.name | startswith("quivra-")))] | sort_by(.name)')"
          test "$(jq -c 'map(.name)' <<< "$artifacts")" = "$expected"
          printf 'ids=%s\n' "$(jq -r 'map(.id | tostring) | join(",")' <<< "$artifacts")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: ${{ runner.temp }}/quivra
          merge-multiple: true
      - name: Validate release artifacts
        env:
          VERSION: ${{ inputs.version }}
          ARTIFACTS: ${{ runner.temp }}/quivra
        run: node distribution/verify-release.ts "$VERSION" "$ARTIFACTS"

  publish-npm:
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-main
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the pinned compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-ids }}
          path: ${{ runner.temp }}/quivra
          merge-multiple: true
      - name: Publish the verified package set using npm Trusted Publishing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ARTIFACTS: ${{ runner.temp }}/quivra
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          tag="v$VERSION"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.sha")
          if [ -n "$tag_sha" ]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
          fi
          node distribution/verify-release.ts "$VERSION" "$ARTIFACTS" --publish-npm

  release:
    if: inputs.publish
    needs: [validate, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-ids }}
          path: ${{ runner.temp }}/quivra
          merge-multiple: true
      - name: Publish GitHub Release after npm succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ARTIFACTS: ${{ runner.temp }}/quivra
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag"); then
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
            test "$(jq -r .draft <<< "$release")" = false
            for file in "$ARTIFACTS"/*.tar.gz "$ARTIFACTS"/*.sha256; do
              expected="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
              test "$(jq -r --arg name "$(basename "$file")" '.assets[] | select(.name == $name) | .digest' <<< "$release")" = "$expected"
            done
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Quivra $VERSION" --generate-notes "$ARTIFACTS"/*.tar.gz "$ARTIFACTS"/*.sha256
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" = "$GITHUB_SHA"
