name: Release Quivra
run-name: Publish Quivra (${{ github.sha }})

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      specifier:
        description: Version increment
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: Exact next version, if supplied
        type: string
      source_sha:
        description: Expected main commit for an automatic release request
        type: string

permissions: {}

concurrency:
  group: quivra-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      ${{ github.repository == 'pixel-brewery/quivra' && github.repository_id == '1457527723' &&
          github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify the public repository and current protected main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test -z "$EXPECTED_SOURCE_SHA" || test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq 'select(.id == 1457527723) | .visibility')" = public
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq 'any(.[]; .type == "pull_request") and any(.[]; .type == "required_status_checks" and
              .parameters.strict_required_status_checks_policy and
              any(.parameters.required_status_checks[]; .context == "Quality Gate" and .integration_id == 15368))' | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/environments/release-main/deployment-branch-policies" \
            --jq '([.branch_policies[] | select(.name == "main" and .type == "branch")] | length) == 1 and .total_count == 1' | grep -qx true
      - name: Prepare the release commit without pushing
        id: candidate
        env:
          SPECIFIER: ${{ inputs.specifier || 'patch' }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          candidate=$(node distribution/release-candidate.ts prepare "$RUNNER_TEMP/quivra-candidate" "$GITHUB_SHA" "$SPECIFIER" "$REQUESTED_VERSION")
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: bundle
        with:
          name: quivra-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quivra-candidate/candidate.bundle
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      candidate_artifact_id: ${{ needs.prepare.outputs.artifact-id }}
      release_commit: ${{ needs.prepare.outputs.commit }}

  package:
    needs: [prepare, verify]
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      candidate_artifact_id: ${{ needs.prepare.outputs.artifact-id }}
      release_commit: ${{ needs.prepare.outputs.commit }}

  validate:
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-ids: ${{ steps.artifacts.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select this run's unexpired artifact IDs
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(node distribution/prepare.ts matrix | jq -c '[.include[].target | "quivra-" + .] + ["quivra-npm"] | sort')"
          artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            | jq -cs '[.[].artifacts[] | select(.expired == false and (.name | startswith("quivra-")) and (.name | startswith("quivra-candidate-") | not))] | sort_by(.name)')"
          test "$(jq -c 'map(.name)' <<< "$artifacts")" = "$expected"
          printf 'ids=%s\n' "$(jq -r 'map(.id | tostring) | join(",")' <<< "$artifacts")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: ${{ runner.temp }}/quivra
          merge-multiple: true
      - name: Validate release artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACTS: ${{ runner.temp }}/quivra
        run: node distribution/verify-release.ts "$VERSION" "$ARTIFACTS"

  publish-npm:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-main
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@pixel-brewery'
          package-manager-cache: false
      - name: Install the pinned compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/quivra-candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-ids }}
          path: ${{ runner.temp }}/quivra
          merge-multiple: true
      - name: Recheck the release commit, registry versions and refs
        id: preflight
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          ARTIFACTS: ${{ runner.temp }}/quivra
        run: |
          set -euo pipefail
          candidate=$(node distribution/release-candidate.ts import "$RUNNER_TEMP/quivra-candidate" "$GITHUB_SHA" "$RELEASE_COMMIT")
          test "$(jq -r .version <<< "$candidate")" = "$VERSION"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq 'select(.id == 1457527723) | .visibility')" = public
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          tag=$(git ls-remote --tags origin "refs/tags/v$VERSION" | cut -f1)
          if [ "$main" = "$RELEASE_COMMIT" ] && [ "$tag" = "$RELEASE_COMMIT" ]; then
            echo 'push=false' >> "$GITHUB_OUTPUT"
          elif [ "$main" = "$GITHUB_SHA" ] && [ -z "$tag" ]; then
            echo 'push=true' >> "$GITHUB_OUTPUT"
          else
            echo 'main or the release tag moved beyond this candidate.' >&2
            exit 1
          fi
          node distribution/verify-release.ts "$VERSION" "$ARTIFACTS" --preflight-npm
      - name: Require the Pixel Brewery Releases App configuration
        if: steps.preflight.outputs.push == 'true'
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_KEY_CONFIGURED: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$RELEASE_APP_ID" != 5547670 ] || [ "$RELEASE_KEY_CONFIGURED" != true ]; then
            echo 'Configure Pixel Brewery Releases App 5547670 and its private key in release-main.' >&2
            exit 1
          fi
      - name: Create the protected-main release App token
        if: steps.preflight.outputs.push == 'true'
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Atomically push the verified version commit and tag
        if: steps.preflight.outputs.push == 'true'
        env:
          RELEASE_PUSH_TOKEN: ${{ steps.release-app.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push --atomic origin "$RELEASE_COMMIT:refs/heads/main" "$RELEASE_COMMIT:refs/tags/v$VERSION"
      - name: Publish the verified tarballs to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          ARTIFACTS: ${{ runner.temp }}/quivra
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha)" = "$RELEASE_COMMIT"
          node distribution/verify-release.ts "$VERSION" "$ARTIFACTS" --publish-npm

  verify-public:
    needs: [prepare, validate, publish-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned compiler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-ids }}
          path: ${{ runner.temp }}/quivra
          merge-multiple: true
      - name: Verify all versions are public and linked to Quivra
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACTS: ${{ runner.temp }}/quivra
        run: node distribution/verify-release.ts "$VERSION" "$ARTIFACTS" --verify-public

  release:
    needs: [prepare, validate, verify-public]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-ids }}
          path: ${{ runner.temp }}/quivra
          merge-multiple: true
      - name: Publish GitHub Release after package verification succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          ARTIFACTS: ${{ runner.temp }}/quivra
        run: |
          set -euo pipefail
          tag="v$VERSION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$RELEASE_COMMIT"
          if release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag"); then
            test "$(jq -r .draft <<< "$release")" = false
            for file in "$ARTIFACTS"/*.tar.gz "$ARTIFACTS"/*.sha256; do
              expected="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
              test "$(jq -r --arg name "$(basename "$file")" '.assets[] | select(.name == $name) | .digest' <<< "$release")" = "$expected"
            done
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Quivra $VERSION" --generate-notes "$ARTIFACTS"/*.tar.gz "$ARTIFACTS"/*.sha256
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$RELEASE_COMMIT"
