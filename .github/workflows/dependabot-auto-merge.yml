name: Merge verified Dependabot updates

on:
  workflow_run:
    workflows: [CI, Release Quivra]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    if: >-
      ${{ github.repository_id == '1457527723' &&
          github.repository == 'pixel-brewery/quivra' &&
          github.event.repository.private == false &&
          github.event.repository.default_branch == 'main' &&
          vars.QUIVRA_DEPENDABOT_AUTO_MERGE == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: dependabot-reconcile
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Refresh stale dependency heads and request full read-only CI
        env:
          GH_TOKEN: ${{ github.token }}
          QUIVRA_DEPENDABOT_AUTO_MERGE: ${{ vars.QUIVRA_DEPENDABOT_AUTO_MERGE }}
          DEPENDABOT_MODE: reconcile
        run: node .github/scripts/runDependabotAutomation.ts

  merge:
    needs: reconcile
    if: >-
      ${{ always() && github.event_name == 'workflow_run' &&
          github.repository_id == '1457527723' &&
          github.repository == 'pixel-brewery/quivra' &&
          github.event.repository.private == false &&
          github.event.repository.default_branch == 'main' &&
          vars.QUIVRA_DEPENDABOT_AUTO_MERGE == 'true' &&
          github.event.workflow_run.name == 'CI' &&
          github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
          ((github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.actor.id == 49699333) ||
           (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.actor.id == 41898282)) &&
          github.event.workflow_run.head_repository.id == 1457527723 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: dependabot-merge-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    outputs:
      merge_sha: ${{ steps.merge.outputs.sha }}
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Squash merge the verified Dependabot head
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          QUIVRA_DEPENDABOT_AUTO_MERGE: ${{ vars.QUIVRA_DEPENDABOT_AUTO_MERGE }}
          DEPENDABOT_MODE: merge
        run: node .github/scripts/runDependabotAutomation.ts

  request-continuation:
    needs: merge
    if: needs.merge.outputs.merge_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: dependabot-release-${{ needs.merge.outputs.merge_sha }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Continue exact-source CI and the existing release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          QUIVRA_DEPENDABOT_AUTO_MERGE: ${{ vars.QUIVRA_DEPENDABOT_AUTO_MERGE }}
          SOURCE_SHA: ${{ needs.merge.outputs.merge_sha }}
          DEPENDABOT_MODE: continue
        run: node .github/scripts/runDependabotAutomation.ts
