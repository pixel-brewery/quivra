name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pages.yml
      - .github/assets/quivra-icon.png
      - 'site/**'
      - schemas/profile.schema.json
      - schemas/batch.schema.json
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Merge commit requested by Dependabot auto-merge
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.repository == 'pixel-brewery/quivra' && !github.event.repository.private &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the requested dependency source
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: test -z "$EXPECTED_HEAD_SHA" || test "$EXPECTED_HEAD_SHA" = "$GITHUB_SHA"
      - name: Stage the product icon and configuration schemas
        run: |
          mkdir -p site/schemas
          cp .github/assets/quivra-icon.png site/assets/quivra-icon.png
          cp schemas/profile.schema.json schemas/batch.schema.json site/schemas/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
